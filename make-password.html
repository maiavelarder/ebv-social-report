<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Make Password</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#1d1c1a;background:#f6f4ef}
input,button{font:inherit;padding:10px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box;margin:6px 0}
button{background:#1d1c1a;color:#fff;border:0;cursor:pointer}code{display:block;word-break:break-all;background:#fff;border:1px solid #ddd;padding:10px;border-radius:8px}</style></head>
<body><h2>Create a new dashboard password</h2>
<p>Type the new password. Nothing is sent anywhere; this runs in your browser.</p>
<input id="p" type="text" placeholder="New password"><button id="b">Generate</button>
<p>Copy this into <b>PASSWORD_HASH</b> in config.js:</p><code id="o">–</code>
<script>
document.getElementById('b').onclick=async()=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(document.getElementById('p').value.trim()));
document.getElementById('o').textContent=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');};
</script></body></html>
